name: Feature request
description: Propose a focused improvement inside the documented project boundary.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete use case and why existing behavior is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security-boundary impact
      description: State whether this changes an embedding context, escape rule, export, or release artefact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
